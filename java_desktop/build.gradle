plugins {
    id 'application'
}

group = 'vn.smsbridge'
version = '2.0.0'

layout.buildDirectory.set(file("${System.getProperty('user.home')}/.cache/sms_java_build"))

repositories { mavenCentral() }

dependencies {
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'org.json:json:20240303'
}

application {
    mainClass = 'vn.smsbridge.desktop.SmsSenderDesktop'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

jar {
    manifest {
        attributes 'Main-Class': 'vn.smsbridge.desktop.SmsSenderDesktop'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveBaseName = 'SmsSenderTool'
    archiveClassifier = 'standalone'
}

tasks.register('packageMacApp', Exec) {
    dependsOn tasks.installDist
    def javaHome = System.getProperty('java.home')
    def appName = 'SmsSenderTool'
    doFirst {
        mkdir "$buildDir/jpackage"
        commandLine "$javaHome/bin/jpackage",
            '--type', 'app-image',
            '--name', appName,
            '--input', "$buildDir/install/$appName/lib",
            '--main-jar', "$appName-${project.version}.jar",
            '--main-class', application.mainClass.get(),
            '--dest', "$buildDir/jpackage"
    }
}
